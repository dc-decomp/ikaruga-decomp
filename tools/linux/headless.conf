# headless.conf: project settings for headless_run.sh (sourced as bash).
REPO="$(cd "$HERE/../.." && pwd)"

# --- the game --------------------------------------------------------------------------------
GAME=ikaruga
BUILD_DIR_DEFAULT="$REPO/build-port"
COPY_FILES=("ikaruga" "libSDL3.so*")
ASSET_LINKS=("game=$REPO/game")

# This game logs to stdout and reads no config file in a scripted run.
RUN_CONFIG_NAME=""
RUN_CONFIG_CONTENT=""
LOG_GLOB=""

# --- safety (always on the command line) -----------------------------------------------------
# --no-gamepads is the command-line switch that keeps SDL from ever opening a real pad.
SAFETY_FLAGS=(--no-audio --no-gamepads)
PAD_IGNORE="*"
GRAPHICS=vulkan
EXTRA_ENV=(MESA_SHADER_CACHE_DIR="/tmp/ikaruga-shadercache-$USER")
# No spaces in this path, so the harness's unquoted EXTRA expansion is safe. The GDI's tracks
# are in the same directory and it names them relatively.
EXTRA="--window --disc $REPO/game/disc/disc.gdi --saves saves --scale 1"

# --- detection -------------------------------------------------------------------------------
CRASH_RE='^signal [0-9]+, backtrace:|unimplemented|Aborted|Segmentation fault|Assertion'
PAD_RE='input: opened gamepad'
GDB_BREAK="on_crash"
GDB_PASS_SIGNALS=(SIGUSR1 SIGUSR2 SIGPIPE)

# --- driving ---------------------------------------------------------------------------------
# The first boots are slow without a warm shader cache; repeat Start instead of timing one press.
DEFAULT_KEYS=(35:Return 50:Return 65:Return 80:Return)
DISPLAY_NUM_DEFAULT=91
SCREEN=1024x768x24
SHOT_SIZE=960x720
MAX_GAMES=2
